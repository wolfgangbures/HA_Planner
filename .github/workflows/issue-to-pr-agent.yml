name: Issue → AI Agent PR

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-pr-from-issue:
    if: ${{ github.event.issue.pull_request == null }}
    runs-on: ubuntu-latest

    steps:
      - name: Assign issue to Copilot
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: ["Copilot"]
            });
            core.info("Assigned issue to @Copilot.");

      - name: Add Copilot instructions comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: [
                "@Copilot Please implement this issue.",
                "",
                "**Instructions:**",
                "1. Analyze the issue and inspect relevant code paths.",
                "2. Retrieve live Home Assistant logs from the HA1180 live instance using the ha-logs-retrieval.yml workflow (download artifact ha-logs, summarize key errors/warnings and probable root causes).",
                "3. Propose and implement a minimal, safe fix based on code + live log evidence.",
                "4. Add or update tests where appropriate.",
                `5. Open a pull request referencing #${issue.number}.`,
                "6. In the PR description, include: root cause (with log evidence from HA1180), implementation summary, test coverage, and risks/follow-ups.",
              ].join("\n"),
            });

      - name: Comment on issue (acknowledgement)
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: "🤖 I assigned this issue to Copilot and requested a suggested PR."
            });
